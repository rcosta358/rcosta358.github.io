name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare CV output directory
        run: mkdir -p cv/build
      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: main.tex
          texlive_version: 2026
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
      - name: Publish generated CV PDF
        run: cp cv/build/main.pdf public/RicardoCostaCV.pdf
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
